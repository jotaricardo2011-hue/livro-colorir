<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff8a3d">
<title>Meu Livro de Colorir</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7ec;--ink:#3b2a1a;--accent:#ff8a3d;--card:#fff;--line:#f1dfc8;--shadow:0 4px 0 rgba(0,0,0,.12);--cur:#ff4d4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ---------- Galeria ---------- */
#home header{position:relative;padding:calc(18px + env(safe-area-inset-top)) 64px 6px;text-align:center}
#home h1{margin:0;font-size:clamp(28px,6.5vw,46px);line-height:1.05;font-weight:800}
#home h1 span{color:var(--accent)}
#home p{margin:4px 0 0;font-size:clamp(17px,4vw,22px);font-weight:600;opacity:.7}
#gear{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:48px;height:48px;border-radius:50%;font-size:26px;opacity:.45;transition:transform 1.2s linear,opacity .2s}
#gear.hold{transform:rotate(360deg) scale(1.25);opacity:1}
.grid{flex:1;overflow:auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:16px;align-content:start;max-width:1100px;width:100%;margin:0 auto}
.page{background:var(--card);border-radius:22px;padding:10px 10px 6px;box-shadow:var(--shadow);border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .1s}
.page:active{transform:scale(.95)}
.page canvas{width:100%;height:auto;aspect-ratio:800/960;border-radius:14px;background:#fff;display:block}
.page b{font-size:21px;font-weight:800}

/* ---------- Pintura ---------- */
#paint .bar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 8px 4px}
.tool{width:clamp(44px,12vw,58px);height:clamp(44px,12vw,58px);border-radius:16px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;border:3px solid transparent;transition:transform .08s}
.tool:active{transform:scale(.9)}
.tool svg{width:60%;height:60%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tool .tint{fill:var(--cur);stroke:var(--ink)}
.tool.sel{border-color:var(--accent);background:#fff1e6}
.sep{width:6px}
.sizes{display:none;gap:6px}
.sizes.on{display:flex}
.sz i{display:block;border-radius:50%;background:var(--cur);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 8px}
#view{display:block;background:#fff;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.13);touch-action:none}
.palette{display:grid;grid-template-columns:repeat(9,1fr);gap:7px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:0 auto}
.sw{width:100%;max-width:52px;aspect-ratio:1;justify-self:center;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.18);transition:transform .1s}
.sw.sel{transform:scale(1.18);box-shadow:0 0 0 3px var(--ink)}

@media (orientation:landscape) and (min-aspect-ratio:5/4){
  #paint{flex-direction:row}
  #paint .bar{flex-direction:column;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top)) 6px 8px calc(8px + env(safe-area-inset-left));max-height:100%;align-content:center}
  .tool{width:clamp(40px,11vh,58px);height:clamp(40px,11vh,58px)}
  .sizes{flex-direction:column}
  .sep{height:4px;width:auto}
  .palette{grid-template-columns:repeat(3,auto);align-content:center;width:auto;margin:0;padding:8px calc(10px + env(safe-area-inset-right)) 8px 4px;overflow-y:auto;max-width:none}
  .sw{width:clamp(34px,10vh,50px)}
}

/* ---------- Janela dos pais / avisos ---------- */
.modal{position:fixed;inset:0;background:rgba(59,42,26,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.on{display:flex}
.box{background:#fff;border-radius:24px;padding:22px 20px;width:100%;max-width:380px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.box h2{margin:0 0 12px;font-size:24px;line-height:1.15}
.box input[type=text]{width:100%;font:inherit;font-size:24px;font-weight:800;text-align:center;padding:10px;border:3px solid var(--line);border-radius:16px;outline:none;color:var(--ink)}
.box input[type=text]:focus{border-color:var(--accent)}
.big{display:block;width:100%;margin-top:14px;padding:12px;border-radius:16px;background:var(--accent);color:#fff;font-size:22px;font-weight:800;box-shadow:var(--shadow)}
.ghost{display:block;width:100%;margin-top:10px;padding:10px;border-radius:14px;background:#f6efe6;font-size:17px;font-weight:600}
.danger{color:#c62828}
.extra{display:none;margin-top:6px}
.extra.on{display:block}
.extra label{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:18px;font-weight:600}
.extra label input{width:22px;height:22px;accent-color:var(--accent)}
.hint{font-size:14px;opacity:.6;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,40px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:17px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.boom{position:fixed;font-size:34px;pointer-events:none;z-index:30;animation:fly 1.3s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.4) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(240deg);opacity:0}}
</style>
</head>
<body>

<section id="home" class="screen on">
  <header>
    <h1>Livro de <span>Colorir</span></h1>
    <p id="dono">Escolha um desenho!</p>
    <button id="gear" aria-label="Área dos pais (segure)">⚙</button>
  </header>
  <div class="grid" id="grid"></div>
</section>

<section id="paint" class="screen">
  <div class="bar">
    <button class="tool" id="bHome" aria-label="Voltar aos desenhos"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></button>
    <span class="sep"></span>
    <button class="tool sel" data-tool="fill" aria-label="Balde: pintar área"><svg viewBox="0 0 24 24"><path d="M4 10 11 3l8 8-7 7a2 2 0 0 1-3 0l-5-5a2 2 0 0 1 0-3z"/><path class="tint" d="M5 12h14l-7 7z"/><path class="tint" d="M20.5 13.5s2 2.8 2 4.2a2 2 0 0 1-4 0c0-1.4 2-4.2 2-4.2z"/></svg></button>
    <button class="tool" data-tool="brush" aria-label="Pincel"><svg viewBox="0 0 24 24"><path d="M19 2.5l2.5 2.5-9 9-2.5-2.5z"/><path class="tint" d="M9.5 12.5c-3 0-5 2-5 5 0 1.5-1 2.8-2.2 3 2.2 1.2 7.4 1 8.4-2 .7-2.2-.2-4.6-1.2-6z"/></svg></button>
    <button class="tool" data-tool="eraser" aria-label="Borracha"><svg viewBox="0 0 24 24"><path d="M8 20h13"/><path d="M3.6 14.6l9.5-10a2 2 0 0 1 2.9 0l3.9 3.9a2 2 0 0 1 0 2.9L11.6 20H8.4z"/><path d="M8.5 9.6l6.2 6.2"/></svg></button>
    <span class="sizes" id="sizes">
      <button class="tool sz" data-size="14" aria-label="Fino"><i style="width:8px;height:8px"></i></button>
      <button class="tool sz sel" data-size="32" aria-label="Médio"><i style="width:15px;height:15px"></i></button>
      <button class="tool sz" data-size="64" aria-label="Grosso"><i style="width:24px;height:24px"></i></button>
    </span>
    <span class="sep"></span>
    <button class="tool" id="bUndo" aria-label="Desfazer"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="tool" id="bClear" aria-label="Limpar página"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <button class="tool" id="bSave" aria-label="Guardar foto do desenho"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg></button>
  </div>
  <div id="stage"><canvas id="view" width="800" height="960"></canvas></div>
  <div class="palette" id="palette"></div>
</section>

<div class="modal" id="modal">
  <div class="box">
    <h2 id="mTitle">Para quem é este livro? 🎨</h2>
    <input type="text" id="nomeIn" maxlength="14" placeholder="Nome da criança" autocomplete="off">
    <button class="big" id="okNome">Começar</button>
    <div class="extra" id="extra">
      <label><input type="checkbox" id="somChk" checked> Sons ligados</label>
      <button class="ghost danger" id="apagar">Apagar todas as pinturas</button>
      <button class="ghost" id="fechar">Fechar</button>
    </div>
    <div class="hint" id="mHint">O nome aparece em cada página para a criança pintar.</div>
  </div>
</div>
<div id="toast"></div>

/* ---------- Desenhos (traço preto; fill="#fff" esconde o que fica atrás) ---------- */
function star(cx, cy, r, ri = r * 0.45, n = 5) {
  let d = '';
  for (let i = 0; i < n * 2; i++) {
    const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? ri : r;
    d += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1);
  }
  return d + 'Z';
}
function petals(cx, cy, n, d, r) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = i * 2 * Math.PI / n;
    s += `<circle cx="${(cx + d * Math.cos(a)).toFixed(1)}" cy="${(cy + d * Math.sin(a)).toFixed(1)}" r="${r}" fill="#fff"/>`;
  }
  return s;
}
function cloud(x, y, s = 1) {
  const p = (dx, dy) => `${(x + dx * s).toFixed(1)} ${(y + dy * s).toFixed(1)}`;
  return `<path d="M${p(-110, 40)} Q${p(-150, 40)} ${p(-140, 0)} Q${p(-130, -40)} ${p(-85, -30)} Q${p(-70, -85)} ${p(-10, -75)} Q${p(40, -110)} ${p(85, -60)} Q${p(145, -60)} ${p(140, -5)} Q${p(160, 40)} ${p(110, 40)} Z" fill="#fff"/>`;
}

function heart(x, y, s = 1) {
  const p = (dx, dy) => `${(x + dx * s).toFixed(1)} ${(y + dy * s).toFixed(1)}`;
  return `M${p(0, 70)} C${p(-60, 30)} ${p(-50, -30)} ${p(0, 0)} C${p(50, -30)} ${p(60, 30)} ${p(0, 70)} Z`;
}
function gear(cx, cy, r, n = 8) {
  let d = ''; const ri = r * 0.78, w = Math.PI / n * 0.5;
  for (let i = 0; i < n; i++) {
    const a = i * 2 * Math.PI / n;
    [[a - w * 1.4, ri], [a - w, r], [a + w, r], [a + w * 1.4, ri]].forEach(([b, rr], k) => {
      d += (i || k ? 'L' : 'M') + (cx + rr * Math.cos(b)).toFixed(1) + ' ' + (cy + rr * Math.sin(b)).toFixed(1);
    });
  }
  return d + 'Z';
}
// Rosto padrão dos personagens: olhos, sorriso e bochechas.

  return `<circle cx="${x - 30}" cy="${y + 5}" r="10" fill="#000"/><circle cx="${x + 30}" cy="${y + 5}" r="10" fill="#000"/>` +

}

const CORES = ['#ff4d4d','#ff8a3d','#ffd23f','#8bd346','#2fa84f','#38c6d9','#a3d5ff','#3a86ff','#1d3fa0',
               '#9b5de5','#f15bb5','#ffb3c6','#f1c27d','#c68642','#8d5524','#9e9e9e','#4a4a4a','#ffffff'];

/* ---------- Estado e armazenamento (tudo fica só no aparelho) ---------- */
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const st = { nome: '', som: true, lines: {}, masks: {}, page: null, tool: 'fill', color: CORES[0], size: 32, undo: [] };
const $ = s => document.querySelector(s);
const col = document.createElement('canvas'); col.width = W; col.height = H;
const cx = col.getContext('2d', { willReadFrequently: true });
const view = $('#view'), vx = view.getContext('2d');

/* ---------- Som ---------- */
let ac;
function beep(f = 520, d = 0.12, delay = 0) {
  if (!st.som) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.6, t + d);
    g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}

/* ---------- Traço da página (desenho + nome da criança) ---------- */
function svgDoc(inner) {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${DH}" viewBox="0 0 800 800"><g fill="none" stroke="#000" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">${inner}</g></svg>`;
}
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
function drawName(x) {
  const y0 = DH + 14, h = H - DH - 28, nome = st.nome.trim();
  x.save(); x.strokeStyle = '#000'; x.lineJoin = 'round'; x.lineWidth = 7;
  x.beginPath(); if (x.roundRect) x.roundRect(24, y0, W - 48, h, 34); else x.rect(24, y0, W - 48, h); x.stroke();
  x.stroke(new Path2D(star(90, y0 + h / 2, 40))); x.stroke(new Path2D(star(W - 90, y0 + h / 2, 40)));
  if (nome) {
    const f = s => `900 ${s}px "Arial Black","Arial Rounded MT Bold","Helvetica Neue",Arial,sans-serif`;
    let size = 104; x.font = f(size);
    while (x.measureText(nome).width > W - 260 && size > 36) { size -= 4; x.font = f(size); }
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineWidth = 6;
    x.strokeText(nome, W / 2, y0 + h / 2 + 4);
  }
  x.restore();
}
async function buildLines(p) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  const img = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgDoc(p.svg)));
  x.drawImage(img, 0, 0, W, DH);
  drawName(x);
  // Converte o branco em transparente e guarda onde estão as linhas (as "paredes" do balde).
  const im = x.getImageData(0, 0, W, H), d = im.data, m = new Uint8Array(W * H);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) {
    const dark = 255 - Math.min(d[i], d[i + 1], d[i + 2]);
    d[i] = d[i + 1] = d[i + 2] = 0; d[i + 3] = dark; m[j] = dark > 110 ? 1 : 0;
  }
  x.putImageData(im, 0, 0);
  st.lines[p.id] = c; st.masks[p.id] = m;
}
const buildAll = () => Promise.all(PAGES.map(buildLines));

/* ---------- Galeria ---------- */
function esc(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
async function drawThumb(c, p) {
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  const s = LS.get('lc_p_' + p.id);
  if (s) { try { x.drawImage(await loadImg(s), 0, 0, c.width, c.height); } catch (e) {} }
  x.drawImage(st.lines[p.id], 0, 0, c.width, c.height);
}
function renderHome() {
  $('#dono').innerHTML = st.nome.trim() ? `de <b style="color:var(--accent)">${esc(st.nome.trim())}</b> — escolha um desenho!` : 'Escolha um desenho!';
  const g = $('#grid'); g.innerHTML = '';
  PAGES.forEach(p => {
    const b = document.createElement('button'); b.className = 'page';
    const c = document.createElement('canvas'); c.width = 240; c.height = 288;
    const t = document.createElement('b'); t.textContent = p.nome;
    b.append(c, t); b.onclick = () => { beep(660); openPage(p); };
    g.append(b); drawThumb(c, p);
  });
}
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); if (id === 'paint') fit(); }

/* ---------- Pintura ---------- */
let rq = 0;
function render() {
  if (rq) return;
  rq = requestAnimationFrame(() => { rq = 0; vx.drawImage(col, 0, 0); vx.drawImage(st.lines[st.page.id], 0, 0); });
}
function fit() {
  const s = $('#stage'), k = Math.min((s.clientWidth - 16) / W, (s.clientHeight - 12) / H);
  view.style.width = Math.max(50, W * k | 0) + 'px'; view.style.height = Math.max(60, H * k | 0) + 'px';
}
addEventListener('resize', () => { if ($('#paint').classList.contains('on')) fit(); });

async function openPage(p) {
  st.page = p; st.undo = [];
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, W, H);
  const s = LS.get('lc_p_' + p.id);
  if (s) { try { cx.drawImage(await loadImg(s), 0, 0); } catch (e) {} }
  show('paint'); render();
}
function pushUndo() { st.undo.push(cx.getImageData(0, 0, W, H)); if (st.undo.length > 10) st.undo.shift(); }
function rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

function nearestFree(px, py, m) {
  for (let r = 1; r <= 14; r++)
    for (let dy = -r; dy <= r; dy++)
      for (let dx = -r; dx <= r; dx++) {
        if (Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
        const x = px + dx, y = py + dy;
        if (x >= 0 && y >= 0 && x < W && y < H && !m[y * W + x]) return y * W + x;
      }
  return -1;
}
function fillAt(px, py, hex) {
  const m = st.masks[st.page.id];
  let idx = py * W + px;
  if (m[idx]) { idx = nearestFree(px, py, m); if (idx < 0) return false; }
  const img = cx.getImageData(0, 0, W, H), d = img.data, [r, g, b] = rgb(hex);
  const N = W * H, seen = new Uint8Array(N), stack = new Int32Array(N), list = new Int32Array(N);
  let sp = 0, n = 0, j;
  stack[sp++] = idx; seen[idx] = 1;
  while (sp) {
    const i = stack[--sp]; list[n++] = i; const x = i % W;
    if (x > 0) { j = i - 1; if (!seen[j] && !m[j]) { seen[j] = 1; stack[sp++] = j; } }
    if (x < W - 1) { j = i + 1; if (!seen[j] && !m[j]) { seen[j] = 1; stack[sp++] = j; } }
    if (i >= W) { j = i - W; if (!seen[j] && !m[j]) { seen[j] = 1; stack[sp++] = j; } }
    if (i < N - W) { j = i + W; if (!seen[j] && !m[j]) { seen[j] = 1; stack[sp++] = j; } }
  }
  // Se toda a área já está nessa cor, não faz nada.
  let same = true;
  for (let t = 0; t < n; t++) { const k = list[t] * 4; if (d[k] !== r || d[k + 1] !== g || d[k + 2] !== b) { same = false; break; } }
  if (same) return false;
  st.undo.push(new ImageData(new Uint8ClampedArray(d), W, H)); if (st.undo.length > 10) st.undo.shift();
  // Avança 2 px por baixo das linhas para não sobrar borda branca.
  let front = Array.from(list.subarray(0, n)); const all = front.slice();
  for (let pass = 0; pass < 2; pass++) {
    const nxt = [];
    for (const i of front) {
      const x = i % W;
      for (const q of [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, i - W, i + W]) {
        if (q >= 0 && q < N && !seen[q]) { seen[q] = 1; nxt.push(q); }
      }
    }
    for (const q of nxt) all.push(q);
    front = nxt;
  }
  for (const i of all) { const k = i * 4; d[k] = r; d[k + 1] = g; d[k + 2] = b; d[k + 3] = 255; }
  cx.putImageData(img, 0, 0);
  return true;
}
function strokeLine(x0, y0, x1, y1) {
  cx.save(); cx.lineCap = 'round'; cx.lineJoin = 'round'; cx.lineWidth = st.size;
  cx.strokeStyle = st.tool === 'eraser' ? '#fff' : st.color;
  cx.beginPath(); cx.moveTo(x0, y0); cx.lineTo(x1, y1); cx.stroke(); cx.restore();
}
function pos(e) { const r = view.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }

let drawing = null;
view.addEventListener('pointerdown', e => {
  if (drawing) return;
  e.preventDefault();
  const [x, y] = pos(e);
  if (st.tool === 'fill') {
    const px = Math.max(0, Math.min(W - 1, x | 0)), py = Math.max(0, Math.min(H - 1, y | 0));
    if (fillAt(px, py, st.color)) { beep(440 + Math.random() * 300); render(); dirty(); }
    return;
  }
  pushUndo(); drawing = { id: e.pointerId, x, y };
  try { view.setPointerCapture(e.pointerId); } catch (_) {}
  strokeLine(x, y, x, y); render();
});
view.addEventListener('pointermove', e => {
  if (!drawing || e.pointerId !== drawing.id) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) { const [x, y] = pos(ev); strokeLine(drawing.x, drawing.y, x, y); drawing.x = x; drawing.y = y; }
  render();
});
const endStroke = e => { if (drawing && e.pointerId === drawing.id) { drawing = null; dirty(); } };
view.addEventListener('pointerup', endStroke);
view.addEventListener('pointercancel', endStroke);

let saveT = 0;
function dirty() { clearTimeout(saveT); saveT = setTimeout(saveNow, 600); }
function saveNow() {
  clearTimeout(saveT);
  if (!st.page) return;
  if (!LS.set('lc_p_' + st.page.id, col.toDataURL('image/png'))) toast('A memória do aparelho está cheia 😕');
}
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

/* ---------- Ferramentas ---------- */
function setTool(t) {
  st.tool = t;
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('sel', b.dataset.tool === t));
  $('#sizes').classList.toggle('on', t !== 'fill');
}
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => { beep(600, 0.06); setTool(b.dataset.tool); });
document.querySelectorAll('.sz').forEach(b => b.onclick = () => {
  beep(600, 0.06); st.size = +b.dataset.size;
  document.querySelectorAll('.sz').forEach(x => x.classList.toggle('sel', x === b));
});
function setColor(c) {
  st.color = c; document.documentElement.style.setProperty('--cur', c);
  document.querySelectorAll('.sw').forEach(s => s.classList.toggle('sel', s.dataset.c === c));
}
CORES.forEach(c => {
  const s = document.createElement('button'); s.className = 'sw'; s.dataset.c = c; s.style.background = c;
  s.setAttribute('aria-label', 'Cor ' + c);
  s.onclick = () => { beep(700, 0.05); setColor(c); if (st.tool === 'eraser') setTool('fill'); };
  $('#palette').append(s);
});
setColor(CORES[0]);

$('#bHome').onclick = () => { beep(500); saveNow(); st.page = null; renderHome(); show('home'); };
$('#bUndo').onclick = () => {
  const u = st.undo.pop();
  if (!u) { beep(200, 0.1); return; }
  beep(380); cx.putImageData(u, 0, 0); render(); dirty();
};
$('#bClear').onclick = () => { beep(300); pushUndo(); cx.fillStyle = '#fff'; cx.fillRect(0, 0, W, H); render(); dirty(); toast('Página limpa — o ↩ desfaz'); };
$('#bSave').onclick = exportar;

function slug(s) { return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
async function exportar() {
  saveNow();
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.drawImage(col, 0, 0); x.drawImage(st.lines[st.page.id], 0, 0);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const name = `${slug(st.page.nome)}${st.nome.trim() ? '-' + slug(st.nome) : ''}.png`;
  celebrate();
  const file = new File([blob], name, { type: 'image/png' });
  if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Meu desenho' }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function celebrate() {
  [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.14, i * 0.11));
  const r = view.getBoundingClientRect();
  for (let i = 0; i < 16; i++) {
    const e = document.createElement('div'); e.className = 'boom';
    e.textContent = ['⭐', '🌟', '✨', '🎉', '💖'][i % 5];
    e.style.left = (r.left + r.width / 2 - 17) + 'px'; e.style.top = (r.top + r.height / 2 - 17) + 'px';
    const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 180;
    e.style.setProperty('--dx', Math.cos(a) * d + 'px'); e.style.setProperty('--dy', Math.sin(a) * d + 'px');
    document.body.append(e); setTimeout(() => e.remove(), 1400);
  }
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }

/* ---------- Nome e área dos pais ---------- */
function openModal(mode) {
  const pais = mode === 'pais';
  $('#mTitle').textContent = pais ? 'Área dos pais ⚙' : 'Para quem é este livro? 🎨';
  $('#okNome').textContent = pais ? 'Salvar nome' : 'Começar';
  $('#extra').classList.toggle('on', pais);
  $('#somChk').checked = st.som;
  $('#nomeIn').value = st.nome;
  $('#modal').classList.add('on');
  if (!pais) setTimeout(() => $('#nomeIn').focus(), 50);
}
async function setNome(n) {
  st.nome = n.trim().slice(0, 14); LS.set('lc_nome', st.nome); LS.set('lc_ok', '1');
  await buildAll(); renderHome();
}
$('#okNome').onclick = async () => { $('#modal').classList.remove('on'); await setNome($('#nomeIn').value); beep(660); };
$('#nomeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('#okNome').click(); });
$('#fechar').onclick = () => $('#modal').classList.remove('on');
$('#somChk').onchange = e => { st.som = e.target.checked; LS.set('lc_som', st.som ? '1' : '0'); };
$('#apagar').onclick = () => {
  if (!confirm('Apagar a pintura de todas as páginas? Isso não pode ser desfeito.')) return;
  PAGES.forEach(p => LS.del('lc_p_' + p.id));
  $('#modal').classList.remove('on'); renderHome(); toast('Pinturas apagadas');
};
// O botão ⚙ só abre se um adulto segurar por 1,2 s.
(() => {
  const g = $('#gear'); let t = 0, opened = false;
  g.addEventListener('pointerdown', () => { opened = false; g.classList.add('hold'); t = setTimeout(() => { opened = true; g.classList.remove('hold'); openModal('pais'); }, 1200); });
  const stop = () => { clearTimeout(t); g.classList.remove('hold'); };
  g.addEventListener('pointerleave', stop); g.addEventListener('pointercancel', stop);
  g.addEventListener('pointerup', () => { stop(); if (!opened) toast('Adulto: segure o botão ⚙'); });
  g.addEventListener('contextmenu', e => e.preventDefault());
})();

/* ---------- Início ---------- */
(async () => {
  const q = new URLSearchParams(location.search).get('nome');
  if (q) { st.nome = q.trim().slice(0, 14); LS.set('lc_nome', st.nome); LS.set('lc_ok', '1'); }
  else st.nome = LS.get('lc_nome') || '';
  st.som = LS.get('lc_som') !== '0';
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
  await buildAll(); renderHome();
  if (!q && !LS.get('lc_ok')) openModal('first');
  // No PC de desenvolvimento (localhost) o modo offline fica desligado para as mudanças aparecerem na hora.
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
